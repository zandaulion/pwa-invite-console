<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consolă admin</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Consolă">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="console.css">
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div>
      <h1>Consolă admin</h1>
      <p class="sub">Doar prin tailnet — accesul la această pagină este
        autentificarea.</p>
    </div>
  </header>

  <div class="picker">
    <label for="appsel">Aplicație</label>
    <select id="appsel"></select>
    <p class="picker-sub" id="appsub"></p>
  </div>

  <section class="block">
    <h2>Invitație nouă</h2>
    <div class="card">
      <form class="row-form" id="form-invite">
        <div class="invite-fields">
          <input id="invite-label" placeholder="Pentru cine? (opțional)"
                 autocomplete="off" aria-label="Etichetă">
          <div id="invite-access" class="invite-access" hidden>
            <label>Tip acces
              <select id="invite-role"></select>
            </label>
            <label id="invite-child-wrap" hidden>Copil
              <select id="invite-child"></select>
            </label>
            <label id="invite-expiry-wrap" hidden>Acces până la
              <input id="invite-expiry" type="date">
            </label>
            <p class="note" id="invite-role-note"></p>
          </div>
        </div>
        <button class="btn" type="submit">Creează invitație</button>
      </form>
      <div id="invite-result" hidden></div>
      <p class="err" id="invite-err" hidden></p>
    </div>
  </section>

  <section class="block">
    <h2>Dispozitive</h2>
    <div class="card" id="devices"><p class="empty">Se încarcă…</p></div>
  </section>

  <section class="block">
    <h2>Invitații</h2>
    <div class="card" id="invites"><p class="empty">Se încarcă…</p></div>
  </section>

  <p class="foot" id="foot"></p>

</div>
<script src="console.js"></script>
<script type="module">
  // Its own module, so the app script can stay a classic script.
  import { installUpdates } from './pwa-update.js';
  installUpdates({ appName: 'Invite Console', scriptUrl: 'sw.js' });
</script>
</body>
</html>
